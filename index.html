        }

        .header h1 {
            font-size: 1.2rem;

            align-items: center;

        }

            font-size: 0.85rem;

        }

            padding: 15px 20px;

        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #4a4c57;
            background-color: #1a1b20;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #4da6ff;
        }

        .controls {
            padding: 12px 20px;
            background-color: #2a2b32;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #3a3b43;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-primary {
            background-color: #4da6ff;
            color: #0d1117;
        }

        .btn-primary:hover {
            background-color: #388ae6;
        }

        .btn-secondary {
            background-color: #3a3c48;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background-color: #4a4c5b;
        }

        .locations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
        }

        .location-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            background-color: #2f3038;
            border-radius: 6px;
            cursor: pointer;
            border-left: 4px solid #4da6ff;
            transition: transform 0.15s, background-color 0.15s;
        }

        .location-item:hover {
            background-color: #383a44;
            transform: translateX(3px);
        }

        .location-item.active {
            background-color: #3a4254;
            border-left-color: #00e676;
        }

        .location-item .number {
            font-weight: bold;
            color: #4da6ff;
            font-size: 0.95rem;
        }

        .location-item .title {
            font-size: 0.9rem;
            color: #f0f0f0;
            margin-top: 2px;
        }

        .location-item .category {
            font-size: 0.75rem;
            color: #8f94a6;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Map Container */

            flex: 1;
            position: relative;
            background-color: #121214;
        }

        #map {
            width: 100%;

            background-color: #25262c;
            color: #fff;
            border-radius: 8px;
            padding: 5px;

            margin-bottom: 6px;
            border-bottom: 1px solid #3a3b43;

            color: #00e676;
            border-radius: 12px;
            font-size: 0.7rem;

            justify-content: center;
            background-color: #ff3d00;
            color: white;
            font-weight: bold;
            font-size: 11px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);

            background-color: #00e676;
        }

            background-color: #00e676;
            transform: scale(1.3);
            border-color: #000;

            pointer-events: none;

            height: 10px;

    <script>
        // ---- Bloqueio por senha ----
        (function () {
            const CORRECT_HASH = "a2bd5c0a8d63b8f4f16242ceb55cd14d26c73366afc5dc373564a2dc54fc9a99";
            const STORAGE_KEY = "btt_map_access_granted_at";
            const VALID_MS = 7 * 24 * 60 * 60 * 1000; // 7 dias

            async function sha256(text) {
                const enc = new TextEncoder().encode(text);
                const buf = await crypto.subtle.digest("SHA-256", enc);
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
            }

            function unlock() {
                document.getElementById("lockScreen").style.display = "none";
            }

            const savedAt = localStorage.getItem(STORAGE_KEY);
            if (savedAt && (Date.now() - parseInt(savedAt, 10)) < VALID_MS) {
                unlock();
            }

            async function tryUnlock() {
                const input = document.getElementById("lockPasswordInput");
                const errorMsg = document.getElementById("lockError");
                const hash = await sha256(input.value);
                if (hash === CORRECT_HASH) {
                    localStorage.setItem(STORAGE_KEY, Date.now().toString());
                    unlock();
                } else {
                    errorMsg.style.display = "block";
                    input.value = "";
                    input.focus();
                }
            }

            document.getElementById("lockSubmitBtn").addEventListener("click", tryUnlock);
            document.getElementById("lockPasswordInput").addEventListener("keyup", function (e) {
                if (e.key === "Enter") tryUnlock();
            });
        })();

        let map, imageBounds;
        let markers = {};
        let isAddMode = false;
        let activeMarkerId = null;

        // Image dimensions (original or standard ratio)
        const imgWidth = 1024;
        const imgHeight = 607;

        function initMap() {
            // Unprojected CRS for simple image coordinate display
            map = L.map('map', {
                crs: L.CRS.Simple,
                minZoom: -1,
                maxZoom: 3,
                zoomSnap: 0.25
            });

            // Set coordinates bounds for the image
            imageBounds = [[0, 0], [imgHeight, imgWidth]];

            // Overlay image (MAPA.jpg or fallback provided image)
            const mapImageUrl = 'MAPA.jpg'; // Expects MAPA.jpg in same directory
            L.imageOverlay(mapImageUrl, imageBounds).addTo(map);

            map.fitBounds(imageBounds);

            // Render existing markers
            renderMarkers();
            renderList();

            // Map click handler for adding new points
            map.on('click', function(e) {
                if (isAddMode) {
                    const y = Math.round(e.latlng.lat);
                    const x = Math.round(e.latlng.lng);
                    
                    const num = prompt("Digite o NÚMERO ou CÓDIGO do ponto:");
                    if (!num) return;

                    const title = prompt("Digite o NOME do prédio/local:");
                    if (!title) return;

                    const category = prompt("Digite a CATEGORIA (ex: Acadêmico, Administrativo, Serviços):") || "Geral";

                    const newLoc = {
                        id: isNaN(num) ? num : parseInt(num),
                        name: title,
                        category: category,
                        x: x,
                        y: y,
                        desc: "Novo ponto adicionado interativamente."
                    };

                    locations.push(newLoc);
                    renderMarkers();
                    renderList();
                    toggleAddMode();
                    
                    // Highlight new marker
                    focusLocation(newLoc.id);
                }
            });
        }

        function renderMarkers() {
            // Clear existing markers
            Object.values(markers).forEach(m => map.removeLayer(m));
            markers = {};

            locations.forEach(loc => {
                // Convert (x,y) to Leaflet CRS.Simple (lat=y, lng=x)
                const lat = loc.y;
                const lng = loc.x;

                const icon = L.divIcon({
                    className: 'custom-pin-container',
                    html: `<div class="custom-pin" id="pin-${loc.id}">${loc.id}</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([lat, lng], { icon: icon }).addTo(map);

                const popupContent = `
                    <div class="popup-card">
                        <h3>📍 Local ${loc.id}: ${loc.name}</h3>
                        <p><strong>Descrição:</strong> ${loc.desc || 'Sem descrição cadastrada.'}</p>
                        <span class="badge">${loc.category}</span>
                    </div>
                `;

                marker.bindPopup(popupContent);

                marker.on('click', () => {
                    highlightListItem(loc.id);
                });

                markers[loc.id] = marker;
            });
        }

        function renderList(itemsToRender = locations) {
            const listEl = document.getElementById('locationsList');
            listEl.innerHTML = '';

            if (itemsToRender.length === 0) {
                listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">Nenhum ponto encontrado.</div>';
                return;
            }

            itemsToRender.forEach(loc => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `location-item ${activeMarkerId === loc.id ? 'active' : ''}`;
                itemDiv.id = `list-item-${loc.id}`;
                itemDiv.onclick = () => focusLocation(loc.id);

                itemDiv.innerHTML = `
                    <div class="number">Local ${loc.id}</div>
                    <div class="title">${loc.name}</div>
                    <div class="category">${loc.category}</div>
                `;

                listEl.appendChild(itemDiv);
            });
        }

        function focusLocation(id) {
            const loc = locations.find(l => l.id == id);
            if (!loc) return;

            activeMarkerId = id;

            // Highlight list item
            document.querySelectorAll('.location-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`list-item-${id}`);
            if (activeEl) {
                activeEl.classList.add('active');
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Highlight marker
            document.querySelectorAll('.custom-pin').forEach(el => el.classList.remove('highlight'));
            const pinEl = document.getElementById(`pin-${id}`);
            if (pinEl) pinEl.classList.add('highlight');

            // Pan map to location & open popup
            if (markers[id]) {
                map.flyTo([loc.y, loc.x], 1, { duration: 0.8 });
                markers[id].openPopup();
            }
        }

        function highlightListItem(id) {
            activeMarkerId = id;
            document.querySelectorAll('.location-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`list-item-${id}`);
            if (activeEl) {
                activeEl.classList.add('active');
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            document.querySelectorAll('.custom-pin').forEach(el => el.classList.remove('highlight'));
            const pinEl = document.getElementById(`pin-${id}`);
            if (pinEl) pinEl.classList.add('highlight');
        }

        function filterLocations() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = locations.filter(loc => 
                loc.id.toString().includes(query) || 
                loc.name.toLowerCase().includes(query) ||
                loc.category.toLowerCase().includes(query)
            );
            renderList(filtered);
        }

        function toggleAddMode() {
            isAddMode = !isAddMode;
            const btn = document.getElementById('addBtn');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (isAddMode) {
                btn.style.backgroundColor = '#ff3d00';
                btn.style.color = '#fff';
                btn.innerText = '❌ Cancelar Inserção';
                statusDot.style.backgroundColor = '#ff3d00';
                statusText.innerText = 'Clique no mapa para marcar um ponto';
                map.getContainer().style.cursor = 'crosshair';
            } else {
                btn.style.backgroundColor = '#4da6ff';
                btn.style.color = '#0d1117';
                btn.innerText = '➕ Adicionar Ponto';
                statusDot.style.backgroundColor = '#00e676';
                statusText.innerText = 'Modo de Navegação';
                map.getContainer().style.cursor = '';
            }
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(locations, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "pontos_mapa.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Initialize on load
        window.onload = initMap;
    </script>
