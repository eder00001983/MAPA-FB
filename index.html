        }

        }

        .header h1 {
            font-size: 1.2rem;

            margin-bottom: 6px;

        }

        }

            padding: 15px 20px;

        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #4a4c57;
            background-color: #1a1b20;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #4da6ff;
        }

        .controls {
            padding: 12px 20px;
            background-color: #2a2b32;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #3a3b43;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-primary {
            background-color: #4da6ff;
            color: #0d1117;
        }

        .btn-primary:hover {
            background-color: #388ae6;
        }

        .btn-secondary {
            background-color: #3a3c48;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background-color: #4a4c5b;
        }

        .locations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
        }

        .location-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            background-color: #2f3038;
            border-radius: 6px;
            cursor: pointer;
            border-left: 4px solid #4da6ff;
            transition: transform 0.15s, background-color 0.15s;
        }

        .location-item:hover {
            background-color: #383a44;
            transform: translateX(3px);
        }

        .location-item.active {
            background-color: #3a4254;
            border-left-color: #00e676;
        }

        .location-item .number {
            font-weight: bold;
            color: #4da6ff;
            font-size: 0.95rem;
        }

        .location-item .title {
            font-size: 0.9rem;
            color: #f0f0f0;
            margin-top: 2px;
        }

        .location-item .category {
            font-size: 0.75rem;
            color: #8f94a6;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Map Container */
        #map-container {
            flex: 1;
            position: relative;
            background-color: #121214;
        }

        #map {
            width: 100%;
            height: 100%;
        }

            background-color: #25262c;
            color: #fff;
            border-radius: 8px;
            padding: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);

        }

            font-size: 1.05rem;
            margin-bottom: 6px;
            border-bottom: 1px solid #3a3b43;

            color: #00e676;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-top: 6px;

            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ff3d00;
            color: white;
            font-weight: bold;
            font-size: 11px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);

        }

            background-color: #00e676;
            transform: scale(1.3);
            border-color: #000;

            right: 15px;

            pointer-events: none;
        }

            height: 10px;

    </style>

    <script>
        // ---- Bloqueio por senha ----
        (function () {
            const CORRECT_HASH = "a2bd5c0a8d63b8f4f16242ceb55cd14d26c73366afc5dc373564a2dc54fc9a99";
            const STORAGE_KEY = "btt_map_access_granted_at";
            const VALID_MS = 7 * 24 * 60 * 60 * 1000; // 7 dias

            async function sha256(text) {
                const enc = new TextEncoder().encode(text);
                const buf = await crypto.subtle.digest("SHA-256", enc);
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
            }

            function unlock() {
                document.getElementById("lockScreen").style.display = "none";
            }

            const savedAt = localStorage.getItem(STORAGE_KEY);
            if (savedAt && (Date.now() - parseInt(savedAt, 10)) < VALID_MS) {
                unlock();
            }

            async function tryUnlock() {
                const input = document.getElementById("lockPasswordInput");
                const errorMsg = document.getElementById("lockError");
                const hash = await sha256(input.value);
                if (hash === CORRECT_HASH) {
                    localStorage.setItem(STORAGE_KEY, Date.now().toString());
                    unlock();
                } else {
                    errorMsg.style.display = "block";
                    input.value = "";
                    input.focus();
                }
            }

            document.getElementById("lockSubmitBtn").addEventListener("click", tryUnlock);
            document.getElementById("lockPasswordInput").addEventListener("keyup", function (e) {
                if (e.key === "Enter") tryUnlock();
            });
        })();
